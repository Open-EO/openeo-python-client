<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" role="img" aria-labelledby="title desc">
  <title id="title">Choosing an inference path</title>
  <desc id="desc">Decision guide: if the workflow is an existing containerised or multi-step pipeline, use CWL. Otherwise, if the model is a fixed ONNX graph without custom logic and the backend supports predict_onnx, use predict_onnx. Otherwise use a UDF with ONNX Runtime.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5174a5"/>
    </marker>
    <style>
      .q { fill:#ffffff; stroke:#5174a5; stroke-width:2; }
      .card { fill:#edf4fb; stroke:#5174a5; stroke-width:2; }
      .title { fill:#24344d; font:700 16px Arial,sans-serif; }
      .qtext { fill:#24344d; font:700 14px Arial,sans-serif; }
      .detail { fill:#5d6b7d; font:13px Arial,sans-serif; }
      .arrow { fill:none; stroke:#5174a5; stroke-width:2.5; marker-end:url(#arrow); }
      .label { fill:#5174a5; font:700 13px Arial,sans-serif; }
    </style>
  </defs>

  <rect width="920" height="400" rx="16" fill="#ffffff" stroke="#e4e9f1" stroke-width="2"/>

  <!-- Question 1 -->
  <rect class="q" x="35" y="40" width="300" height="80" rx="40"/>
  <text class="qtext" x="185" y="74" text-anchor="middle">Existing containerised or</text>
  <text class="qtext" x="185" y="94" text-anchor="middle">multi-step workflow?</text>

  <!-- Question 2 -->
  <rect class="q" x="35" y="240" width="300" height="100" rx="40"/>
  <text class="qtext" x="185" y="273" text-anchor="middle">Fixed ONNX model, no custom</text>
  <text class="qtext" x="185" y="293" text-anchor="middle">logic, and backend lists</text>
  <text class="qtext" x="185" y="313" text-anchor="middle">predict_onnx?</text>

  <!-- Outcome: CWL -->
  <rect class="card" x="560" y="30" width="325" height="100" rx="10"/>
  <text class="title" x="580" y="62">CWL via run_udf (EOAP-CWL)</text>
  <text class="detail" x="580" y="88">Set resource limits per step</text>
  <text class="detail" x="580" y="108">Output a STAC collection</text>

  <!-- Outcome: predict_onnx -->
  <rect class="card" x="560" y="160" width="325" height="100" rx="10"/>
  <text class="title" x="580" y="192">predict_onnx</text>
  <text class="detail" x="580" y="218">No UDF code to maintain</text>
  <text class="detail" x="580" y="238">Preprocess with native processes</text>

  <!-- Outcome: UDF -->
  <rect class="card" x="560" y="280" width="325" height="100" rx="10"/>
  <text class="title" x="580" y="312">UDF with ONNX Runtime</text>
  <text class="detail" x="580" y="338">Custom logic, context, band names</text>
  <text class="detail" x="580" y="358">Good sandbox before predict_onnx</text>

  <!-- Arrows -->
  <path class="arrow" d="M335 80 H560"/>
  <text class="label" x="440" y="70" text-anchor="middle">yes</text>

  <path class="arrow" d="M185 120 V240"/>
  <text class="label" x="200" y="185">no</text>

  <path class="arrow" d="M335 270 H450 V210 H560"/>
  <text class="label" x="400" y="262" text-anchor="middle">yes</text>

  <path class="arrow" d="M335 315 H450 V330 H560"/>
  <text class="label" x="400" y="335" text-anchor="middle">no</text>
</svg>
